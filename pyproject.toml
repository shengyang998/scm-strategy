[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "scm-strategy"
version = "0.2.0"
description = "Reproducible paper analysis, explicit-unit features, and independent synthetic demonstrations"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.urls]
Repository = "https://github.com/shengyang998/scm-strategy"

[project.optional-dependencies]
paper = ["matplotlib>=3.10,<4"]

[project.scripts]
scm-strategy = "scm_strategy.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/scm_strategy"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "scm_strategy/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    ".gitignore",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "docs/data-availability.md",
    "docs/data-contract.md",
    "docs/methods.md",
    "docs/migration_sources.json",
    "docs/paper-reproduction.md",
    "docs/paper-study.md",
    "docs/web-contract.md",
    "examples/synthetic/metadata.json",
    "examples/synthetic/participants.csv",
    "publishing_audit.json",
    "pyproject.toml",
    "release_allowlist.txt",
    "schemas/metadata-v1.schema.json",
    "schemas/participant-record-v1.schema.json",
    "schemas/web-v1.schema.json",
    "src/scm_strategy/__init__.py",
    "src/scm_strategy/__main__.py",
    "src/scm_strategy/analysis.py",
    "src/scm_strategy/cli.py",
    "src/scm_strategy/export.py",
    "src/scm_strategy/features.py",
    "src/scm_strategy/paper_bundle.py",
    "src/scm_strategy/paper_report.py",
    "src/scm_strategy/paper_study.py",
    "src/scm_strategy/paper_synthetic.py",
    "src/scm_strategy/protocols/__init__.py",
    "src/scm_strategy/protocols/paper-bundle-v1.schema.json",
    "src/scm_strategy/protocols/paper_v1.json",
    "src/scm_strategy/schema.py",
    "src/scm_strategy/statistics.py",
    "src/scm_strategy/synthetic.py",
    "tests/test_contract_and_cli.py",
    "tests/test_features_and_statistics.py",
    "tests/test_paper_report.py",
    "tests/test_paper_study.py",
    "tests/test_release_audit.py",
    "tools/audit_release.py",
    "tools/generate_contracts.py",
    "uv.lock",
    "web/README.md",
    "web/app.js",
    "web/app.test.cjs",
    "web/assets/F1_cohort_flow_selection.png",
    "web/assets/F2_prediction_sensitivity.png",
    "web/assets/F3_morphology_associations.png",
    "web/assets/F4_measurement_calibration.png",
    "web/assets/favicon.svg",
    "web/assets/manifest.json",
    "web/data/demo.json",
    "web/fixtures/README.md",
    "web/fixtures/synthetic-local-study.json",
    "web/fixtures/synthetic-local-study.recipe.json",
    "web/index.html",
    "web/styles.css",
    "web/test-dom.cjs",
    "web/validation.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

